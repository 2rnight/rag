[project]
name = "rag-knowledge-base-qa"
version = "2.0.0"
description = "基于 RAG 的企业/个人知识库智能问答系统（FastAPI + LangChain + FAISS + SSE）"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["rag", "llm", "langchain", "faiss", "fastapi", "sse", "knowledge-base"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
rag = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# 示例语料是"文档正文"，尾随空格属于原文形态，不参与代码风格检查
"scripts/generate_sample_docs.py" = ["W291", "W292"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: FastAPI 的 Depends()/Query()/File() 依赖注入就是写在默认参数里的惯用法
ignore = ["E501", "B008"]
